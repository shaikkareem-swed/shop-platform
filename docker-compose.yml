# docker compose up --build        -> everything on http://localhost:8080 (API gateway)
x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP: kafka:9092
x-db-env: &db-env
  DB_USER: shop
  DB_PASSWORD: shop

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  product-service:
    build: {context: ., args: {SERVICE: product-service}}
    environment:
      <<: *db-env
      DB_URL: jdbc:postgresql://postgres:5432/productdb
      REDIS_HOST: redis
      SERVER_PORT: 8081
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: on-failure

  article-service:
    build: {context: ., args: {SERVICE: article-service}}
    environment:
      <<: *db-env
      DB_URL: jdbc:postgresql://postgres:5432/articledb
      REDIS_HOST: redis
      SERVER_PORT: 8082
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: on-failure

  inventory-service:
    build: {context: ., args: {SERVICE: inventory-service}}
    environment:
      <<: [*db-env, *kafka-env]
      DB_URL: jdbc:postgresql://postgres:5432/inventorydb
      SERVER_PORT: 8083
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    restart: on-failure

  order-service:
    build: {context: ., args: {SERVICE: order-service}}
    environment:
      <<: [*db-env, *kafka-env]
      DB_URL: jdbc:postgresql://postgres:5432/orderdb
      REDIS_HOST: redis
      ARTICLE_SERVICE_URL: http://article-service:8082
      SERVER_PORT: 8084
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: on-failure

  api-gateway:
    build: {context: ., args: {SERVICE: api-gateway}}
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8081
      ARTICLE_SERVICE_URL: http://article-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      ORDER_SERVICE_URL: http://order-service:8084
    ports: ["8080:8080"]
    depends_on: [product-service, article-service, inventory-service, order-service]
    restart: on-failure

volumes:
  pgdata:
