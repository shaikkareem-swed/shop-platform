server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: product-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/productdb}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update   # demo only - use Flyway/Liquibase for real environments
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 1s
  cache:
    type: redis
    redis:
      time-to-live: 10m
      key-prefix: "product-service::"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
