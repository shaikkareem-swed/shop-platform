name: CD (build, push to Artifact Registry, deploy to GKE)
on:
  workflow_dispatch:

# Repository variables : GCP_PROJECT_ID, GCP_REGION, GKE_CLUSTER, GKE_LOCATION, AR_REPO (e.g. "shop")
# Repository secrets   : WIF_PROVIDER (projects/123/locations/global/workloadIdentityPools/github/providers/github), WIF_SERVICE_ACCOUNT
permissions:
  contents: read
  id-token: write

env:
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.AR_REPO }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "25", cache: maven}
      - run: mvn -B verify

  build-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, product-service, article-service, inventory-service, order-service]
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: SERVICE=${{ matrix.service }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}
      - name: Render manifests
        run: |
          cp -r k8s /tmp/k8s
          sed -i "s|IMAGE_PREFIX|${REGISTRY}|g; s|IMAGE_TAG|${GITHUB_SHA}|g" /tmp/k8s/20-apps.yaml
      - name: Apply
        run: kubectl apply -f /tmp/k8s/
      - name: Wait for rollout
        run: |
          for d in api-gateway product-service article-service inventory-service order-service; do
            kubectl -n shop rollout status deployment/$d --timeout=300s
          done
