name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build & test
        run: mvn -B verify
      - name: Validate Docker builds
        run: |
          for s in api-gateway product-service article-service inventory-service order-service; do
            docker build --build-arg SERVICE=$s -t $s:ci .
          done
