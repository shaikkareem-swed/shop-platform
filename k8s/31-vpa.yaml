# VPA. Rule of thumb: never let VPA and HPA both act on CPU/memory of the same workload.
#  - product-service : VPA "Auto" (no HPA on it)
#  - order/inventory : VPA "Off" = recommendations only (they are scaled by KEDA)
# Requires the VPA add-on:  gcloud container clusters update CLUSTER --enable-vertical-pod-autoscaling
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: product-service-vpa
  namespace: shop
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: product-service}
  updatePolicy:
    updateMode: "Auto"
    minReplicas: 2
  resourcePolicy:
    containerPolicies:
      - containerName: app
        controlledResources: ["cpu", "memory"]
        minAllowed: {cpu: 100m, memory: 256Mi}
        maxAllowed: {cpu: "1", memory: 1Gi}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: order-service-vpa
  namespace: shop
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: order-service}
  updatePolicy: {updateMode: "Off"}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: inventory-service-vpa
  namespace: shop
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: inventory-service}
  updatePolicy: {updateMode: "Off"}
