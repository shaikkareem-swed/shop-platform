apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-config
  namespace: shop
data:
  KAFKA_BOOTSTRAP: kafka:9092
  REDIS_HOST: redis
  PRODUCT_SERVICE_URL: http://product-service:8081
  ARTICLE_SERVICE_URL: http://article-service:8082
  INVENTORY_SERVICE_URL: http://inventory-service:8083
  ORDER_SERVICE_URL: http://order-service:8084
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: shop
data:
  init.sql: |
    CREATE DATABASE productdb;
    CREATE DATABASE articledb;
    CREATE DATABASE inventorydb;
    CREATE DATABASE orderdb;
---
# DEMO ONLY. Real setups: GCP Secret Manager + External Secrets Operator (or Secrets Store CSI driver).
apiVersion: v1
kind: Secret
metadata:
  name: shop-secrets
  namespace: shop
type: Opaque
stringData:
  DB_USER: shop
  DB_PASSWORD: change-me
