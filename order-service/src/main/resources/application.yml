server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: order-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderdb}
    username: ${DB_USER:shop}
    password: ${DB_PASSWORD:shop}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Liquibase; Hibernate only checks it
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      auto-offset-reset: earliest
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 1s
  cache:
    type: redis
    redis:
      time-to-live: 10m
      key-prefix: "order-service::"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

clients:
  article:
    url: ${ARTICLE_SERVICE_URL:http://localhost:8082}
